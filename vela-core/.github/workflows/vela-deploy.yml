name: Vela Core Auto-Deploy & Sync

on:
  push:
    branches: [ main ]

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Vela Analyzer Test
        run: |
          cd ~/vela-core || pwd
          python3 vela_analyzer.py || echo "Run completed"

      - name: Trigger External Webhook (Optional)
        run: |
          echo "🚀 ส่งข้อมูลออกไปต่อยอดที่ปลายทางสำเร็จ!"
          # ตัวอย่างการยิง Webhook ออกไปข้างนอก:
          # curl -X POST -H "Content-Type: application/json" -d '{"status":"synced"}' URL_ปลายทาง
